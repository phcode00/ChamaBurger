<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>flexbox Playground 🥊</h1>
    <p class="dica">Abra o <strong>style.css</strong> e escreva as proproedades do <code>.container</code> ao vivo.</p>

    <div class="controles">
        <button id="menos" aria-label="Remover caixa">- caixa</button>
        <button id="mais" aria-label="adicionar caixa">+ caixa</button>
    </div>


    <div class="container">
        <div class="box box1"><span class="numero">1</span><span class="tamanho"></span></div>
        <div class="box box2"><span class="numero">2</span><span class="tamanho"></span></div>
        <div class="box box3"><span class="numero">3</span><span class="tamanho"></span></div>
        <div class="box box4"><span class="numero">4</span><span class="tamanho"></span></div>
        <div class="box box5"><span class="numero">5</span><span class="tamanho"></span></div>
        <div class="box box6"><span class="numero">6</span><span class="tamanho"></span></div>
    </div>


    <div class="legenda">
        <span class="principal">Eixo principal: <b id="eixo-principal"></b></span>
        <span class="cruzado">cruzado: <b id="eixo-cruzado"></b></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
